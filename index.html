<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>WM 2026 — Tipp-Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #ffffff;
      --card-bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --de: #d4af37;
      --at: #2563eb;
      --banker: #16a34a;
      --value: #d4af37;
      --underdog: #dc2626;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--card-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--bg);
      color: #fff;
      padding: 16px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .quote {
      font-size: 13px;
      color: #cbd5e1;
    }
    .quote strong { color: #fff; }
    .date-picker {
      background: var(--bg-soft);
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    nav.tabs {
      display: flex;
      background: var(--bg);
      border-top: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 9;
    }
    nav.tabs button {
      flex: 1;
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav.tabs button:hover { color: #fff; }
    nav.tabs button.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    main {
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .match {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .match.de { border-left: 4px solid var(--de); }
    .match.at { border-left: 4px solid var(--at); }
    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .match-teams {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .match-tip {
      font-size: 14px;
      color: var(--text-muted);
    }
    .match-tip strong { color: var(--text); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #fff;
    }
    .badge.banker { background: var(--banker); }
    .badge.value { background: var(--value); color: #1a1a1a; }
    .badge.underdog { background: var(--underdog); }
    .placeholder {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>WM 2026 — Tipp-Dashboard</h1>
    <div class="header-row">
      <div class="quote">Trefferquote: <strong>—</strong></div>
      <input type="date" id="datePicker" class="date-picker" value="2026-06-14">
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="active" data-tab="heute">Heute</button>
    <button data-tab="spiele">Spiele</button>
    <button data-tab="tabellen">Tabellen</button>
    <button data-tab="wetten">Wetten</button>
  </nav>

  <main>
    <section class="tab-panel active" id="tab-heute">
      <h2>Heute &amp; Morgen</h2>
      <div id="todayList"></div>
    </section>

    <section class="tab-panel" id="tab-spiele">
      <h2>Alle Spiele</h2>
      <div id="matchList"></div>
    </section>

    <section class="tab-panel" id="tab-tabellen">
      <h2>Live-Tabellen</h2>
      <div class="placeholder">Tabellen kommen in Schritt 3.</div>
    </section>

    <section class="tab-panel" id="tab-wetten">
      <h2>Wett-Board</h2>
      <div class="placeholder">Wett-Board kommt in Schritt 5.</div>
    </section>
  </main>

  <script>
    // Beispiel-Daten (Schritt 1) — werden in Schritt 2 durch die 72 Spiele ersetzt.
    const matches = [
      {
        id: "E-1-3",
        datum: "2026-06-14",
        zeit: "19:00",
        gruppe: "E",
        heim: "Deutschland",
        gast: "Curaçao",
        tipp: "3:0",
        risiko: "banker",
        flag: "DE"
      },
      {
        id: "J-1-2",
        datum: "2026-06-15",
        zeit: "21:00",
        gruppe: "J",
        heim: "Österreich",
        gast: "Jordanien",
        tipp: "2:0",
        risiko: "value",
        flag: "AT"
      },
      {
        id: "A-1-1",
        datum: "2026-06-11",
        zeit: "20:00",
        gruppe: "A",
        heim: "Mexiko",
        gast: "Marokko",
        tipp: "1:1",
        risiko: "underdog",
        flag: null
      },
      {
        id: "B-1-2",
        datum: "2026-06-12",
        zeit: "18:00",
        gruppe: "B",
        heim: "Spanien",
        gast: "Ghana",
        tipp: "2:1",
        risiko: "value",
        flag: null
      }
    ];

    const risikoLabel = { banker: "Banker", value: "Value", underdog: "Außenseiter" };

    function renderMatch(m) {
      const cls = m.flag === "DE" ? " de" : m.flag === "AT" ? " at" : "";
      return `
        <article class="match${cls}">
          <div class="match-head">
            <span>Gruppe ${m.gruppe} · ${m.datum} · ${m.zeit}</span>
            <span class="badge ${m.risiko}">${risikoLabel[m.risiko]}</span>
          </div>
          <div class="match-teams">${m.heim} – ${m.gast}</div>
          <div class="match-tip">Tipp: <strong>${m.tipp}</strong></div>
        </article>
      `;
    }

    function renderAll() {
      document.getElementById("matchList").innerHTML = matches.map(renderMatch).join("");
      renderToday();
    }

    function renderToday() {
      const selected = document.getElementById("datePicker").value;
      const todays = matches.filter(m => m.datum === selected);
      const list = document.getElementById("todayList");
      if (todays.length === 0) {
        list.innerHTML = `<div class="placeholder">Keine Spiele am ${selected}.</div>`;
      } else {
        list.innerHTML = todays.map(renderMatch).join("");
      }
    }

    // Tab-Umschaltung
    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("datePicker").addEventListener("change", renderToday);

    renderAll();
  </script>
</body>
</html>
