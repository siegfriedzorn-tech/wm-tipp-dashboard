<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #ffffff;
      --card-bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --de: #d4af37;
      --at: #2563eb;
      --banker: #16a34a;
      --value: #d4af37;
      --underdog: #dc2626;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--card-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--bg);
      color: #fff;
      padding: 16px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .quote {
      font-size: 13px;
      color: #cbd5e1;
    }
    .quote strong { color: #fff; }
    .date-picker {
      background: var(--bg-soft);
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    nav.tabs {
      display: flex;
      background: var(--bg);
      border-top: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 9;
    }
    nav.tabs button {
      flex: 1;
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav.tabs button:hover { color: #fff; }
    nav.tabs button.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    main {
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    h2:not(:first-child) { margin-top: 24px; }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filters select {
      flex: 1;
      min-width: 120px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }
    .match {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .match.de { border-left: 4px solid var(--de); }
    .match.at { border-left: 4px solid var(--at); }
    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      gap: 8px;
    }
    .match-teams {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .match-tip {
      font-size: 13px;
      color: var(--text-muted);
    }
    .match-tip strong { color: var(--text); }
    .match-reason {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #fff;
      white-space: nowrap;
    }
    .badge.banker { background: var(--banker); }
    .badge.value { background: var(--value); color: #1a1a1a; }
    .badge.underdog { background: var(--underdog); }
    .placeholder {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .count {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
  </style>
</head>

    ];

    const GRUPPEN = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    const risikoLabel = { banker: "Banker", value: "Value", underdog: "Außenseiter" };

    // Risiko aus Tordifferenz herleiten:
    // |Tor-Diff| >= 2 → Banker, = 1 → Value, = 0 (Remis) → Außenseiter
    function risikoFor(tipp) {
      const [a, b] = tipp.split(":").map(n => parseInt(n, 10));
      const diff = Math.abs(a - b);
      if (diff >= 2) return "banker";
      if (diff === 1) return "value";
      return "underdog";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function renderMatch(m) {
      const cls = m.flag === "DE" ? " de" : m.flag === "AT" ? " at" : "";
      const risiko = risikoFor(m.tipp);
      return `
        <article class="match${cls}">
          <div class="match-head">
            <span>Gruppe ${m.gruppe} · Spieltag ${m.spieltag} · ${m.datum} · ${m.zeit}</span>
            <span class="badge ${risiko}">${risikoLabel[risiko]}</span>
          </div>
          <div class="match-teams">${escapeHtml(m.heim)} – ${escapeHtml(m.gast)}</div>
          <div class="match-tip">Tipp: <strong>${m.tipp}</strong></div>
          <div class="match-reason">${escapeHtml(m.begruendung)}</div>
        </article>
      `;
    }

    function sortByKickoff(a, b) {
      if (a.datum !== b.datum) return a.datum < b.datum ? -1 : 1;
      return a.zeit < b.zeit ? -1 : a.zeit > b.zeit ? 1 : 0;
    }

    function addDays(isoDate, days) {
      const d = new Date(isoDate + "T00:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function formatDateLabel(iso) {
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function renderToday() {
      const selected = document.getElementById("datePicker").value;
      const next = addDays(selected, 1);

      const todays = matches.filter(m => m.datum === selected).sort(sortByKickoff);
      const tomorrows = matches.filter(m => m.datum === next).sort(sortByKickoff);

      document.getElementById("heuteTitle").textContent = `Heute · ${formatDateLabel(selected)}`;
      document.getElementById("morgenTitle").textContent = `Morgen · ${formatDateLabel(next)}`;

      const tList = document.getElementById("todayList");
      const mList = document.getElementById("tomorrowList");
      tList.innerHTML = todays.length ? todays.map(renderMatch).join("") : `<div class="placeholder">Keine Spiele.</div>`;
      mList.innerHTML = tomorrows.length ? tomorrows.map(renderMatch).join("") : `<div class="placeholder">Keine Spiele.</div>`;
    }

    function renderMatchList() {
      const gr = document.getElementById("filterGruppe").value;
      const sp = document.getElementById("filterSpieltag").value;
      const filtered = matches
        .filter(m => !gr || m.gruppe === gr)
        .filter(m => !sp || String(m.spieltag) === sp)
        .sort(sortByKickoff);
      document.getElementById("matchCount").textContent = `${filtered.length} von ${matches.length} Spielen`;
      document.getElementById("matchList").innerHTML = filtered.length
        ? filtered.map(renderMatch).join("")
        : `<div class="placeholder">Keine Spiele für diese Auswahl.</div>`;
    }

    function initFilters() {
      const sel = document.getElementById("filterGruppe");
      GRUPPEN.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = "Gruppe " + g;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", renderMatchList);
      document.getElementById("filterSpieltag").addEventListener("change", renderMatchList);
    }

    // Tab-Umschaltung
    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("datePicker").addEventListener("change", renderToday);

    initFilters();
    renderToday();
    renderMatchList();
  </script>
