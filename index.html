  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {

      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;

      --at: #2563eb;

      --tabs-h: 44px;

    html, body {
      margin: 0;
      padding: 0;
      background: var(--card-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--bg);
      color: #fff;
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quote {
      font-size: 13px;
      color: #cbd5e1;
    }
    .quote strong { color: #fff; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .picker {
      background: var(--bg-soft);
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    nav.tabs {
      display: flex;
      background: var(--bg);
      border-top: 1px solid #334155;
      position: sticky;
      top: var(--header-h);
      z-index: 9;
    }
    nav.tabs button {
      flex: 1;
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav.tabs button:hover { color: #fff; }
    nav.tabs button.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    main {
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    h2:not(:first-child) { margin-top: 24px; }
    .filters {
      display: flex;
      gap: 8px;
      margin: 0 -16px 16px;
      padding: 12px 16px;
      flex-wrap: wrap;
      background: var(--card-bg);
      position: sticky;
      top: calc(var(--header-h) + var(--tabs-h));
      z-index: 8;
      border-bottom: 1px solid var(--border);
    }
    .filters select {
      flex: 1;
      min-width: 120px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }
    .match {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .match.de { border-left: 4px solid var(--de); }
    .match.at { border-left: 4px solid var(--at); }
    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      gap: 8px;
    }
    .match-teams {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .match-tip {
      font-size: 13px;
      color: var(--text-muted);
    }
    .match-tip strong { color: var(--text); }
    .match-reason {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #fff;
      white-space: nowrap;
    }
    .badge.banker { background: var(--banker); }
    .badge.value { background: var(--value); color: #1a1a1a; }
    .badge.underdog { background: var(--underdog); }
    .placeholder {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .count {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
  </style>
</head>

      { id: "m68", kickoff: "2026-06-27T23:00:00+02:00", gruppe: "L", spieltag: 3, heim: "Kroatien", gast: "Ghana", tipp: "2:0", begruendung: "Kroatien macht Platz 2 klar.", tendenz: "Kroatien", flag: null, ergebnis: null, karten: { gelb: [], rot: [] }, status: "offen", treffer: null },
      { id: "m69", kickoff: "2026-06-28T01:30:00+02:00", gruppe: "K", spieltag: 3, heim: "Kolumbien", gast: "Portugal", tipp: "1:1", begruendung: "Spitzenspiel um Platz 1, beide bereits durch.", tendenz: "Remis", flag: null, ergebnis: null, karten: { gelb: [], rot: [] }, status: "offen", treffer: null },
      { id: "m70", kickoff: "2026-06-28T01:30:00+02:00", gruppe: "K", spieltag: 3, heim: "DR Kongo", gast: "Usbekistan", tipp: "1:1", begruendung: "Zwei Debütanten/Außenseiter, offenes Spiel.", tendenz: "Remis", flag: null, ergebnis: null, karten: { gelb: [], rot: [] }, status: "offen", treffer: null },
      { id: "m71", kickoff: "2026-06-28T04:00:00+02:00", gruppe: "J", spieltag: 3, heim: "Algerien", gast: "Österreich", tipp: "1:1", begruendung: "Schlüsselspiel um Platz 2 — Österreich braucht mind. ein Remis.", tendenz: "Remis", flag: "AT", ergebnis: null, karten: { gelb: [], rot: [] }, status: "offen", treffer: null },
      { id: "m72", kickoff: "2026-06-28T04:00:00+02:00", gruppe: "J", spieltag: 3, heim: "Jordanien", gast: "Argentinien", tipp: "0:3", begruendung: "Argentinien dominiert, Messi & Co. in Feierlaune.", tendenz: "Argentinien", flag: null, ergebnis: null, karten: { gelb: [], rot: [] }, status: "offen", treffer: null }
    ];

    // Kickoff-Strings einmalig in echte Date-Objekte konvertieren.
    matches.forEach(m => { m.kickoff = new Date(m.kickoff); });

    const GRUPPEN = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    const risikoLabel = { banker: "Banker", value: "Value", underdog: "Außenseiter" };

    // Zeitzonen-Konfiguration: pro Zone die Locale, in der das Kuerzel
    // schoen rauskommt (de-DE → "MESZ", en-US → "PDT").
    const TZ_OPTIONS = [
      { value: "Europe/Berlin",     label: "Berlin (Deutschland)", abbrevLocale: "de-DE" },
      { value: "America/Vancouver", label: "Vancouver (Kanada)",   abbrevLocale: "en-US" }
    ];

    let currentTz = localStorage.getItem("tz") || "Europe/Berlin";
    if (!TZ_OPTIONS.find(o => o.value === currentTz)) currentTz = "Europe/Berlin";

    function tzConfig(tz) {
      return TZ_OPTIONS.find(o => o.value === tz) || TZ_OPTIONS[0];
    }

    // --- Formatier-Helfer (alle auf Intl.DateTimeFormat mit timeZone) ---

    function formatTime(date, tz) {
      return new Intl.DateTimeFormat("de-DE", {
        hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz
      }).format(date);
    }

    function formatTzAbbrev(date, tz) {
      const parts = new Intl.DateTimeFormat(tzConfig(tz).abbrevLocale, {
        hour: "numeric", timeZoneName: "short", timeZone: tz
      }).formatToParts(date);
      const p = parts.find(x => x.type === "timeZoneName");
      return p ? p.value : "";
    }

    function formatDateShort(date, tz) {
      return new Intl.DateTimeFormat("de-DE", {
        weekday: "short", day: "2-digit", month: "2-digit", timeZone: tz
      }).format(date);
    }

    function formatDateLong(date, tz) {
      return new Intl.DateTimeFormat("de-DE", {
        weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", timeZone: tz
      }).format(date);
    }

    // YYYY-MM-DD des Datums in der gegebenen Zone — der "Tagesschluessel".
    function localDateKey(date, tz) {
      return new Intl.DateTimeFormat("en-CA", {
        year: "numeric", month: "2-digit", day: "2-digit", timeZone: tz
      }).format(date);
    }

    // Date-Key + n Tage (in UTC rechnen, damit Sommer-/Winterzeit nicht stoeren).
    function addDays(isoDate, days) {
      const [y, m, d] = isoDate.split("-").map(Number);
      const date = new Date(Date.UTC(y, m - 1, d));
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }

    // Aus einem YYYY-MM-DD (interpretiert in der gewaehlten Zone) ein langes
    // deutsches Datums-Label bauen. Mittags-UTC liegt fuer alle gaengigen Zonen
    // sicher auf dem gewuenschten Lokaltag.
    function dateKeyToLabel(key, tz) {
      const [y, m, d] = key.split("-").map(Number);
      const noonUtc = new Date(Date.UTC(y, m - 1, d, 12));
      return formatDateLong(noonUtc, tz);
    }

    // --- Risiko aus dem Tipp ableiten ---
    function risikoFor(tipp) {
      const [a, b] = tipp.split(":").map(n => parseInt(n, 10));
      const diff = Math.abs(a - b);
      if (diff >= 2) return "banker";
      if (diff === 1) return "value";
      return "underdog";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    // --- Rendering ---

    function renderMatch(m) {
      const cls = m.flag === "DE" ? " de" : m.flag === "AT" ? " at" : "";
      const risiko = risikoFor(m.tipp);
      const date = formatDateShort(m.kickoff, currentTz);
      const time = formatTime(m.kickoff, currentTz);
      const tz   = formatTzAbbrev(m.kickoff, currentTz);
      return `
        <article class="match${cls}">
          <div class="match-head">
            <span>Gruppe ${m.gruppe} · Spieltag ${m.spieltag} · ${date} · ${time} ${tz}</span>
            <span class="badge ${risiko}">${risikoLabel[risiko]}</span>
          </div>
          <div class="match-teams">${escapeHtml(m.heim)} – ${escapeHtml(m.gast)}</div>
          <div class="match-tip">Tipp: <strong>${m.tipp}</strong></div>
          <div class="match-reason">${escapeHtml(m.begruendung)}</div>
        </article>
      `;
    }

    function sortByKickoff(a, b) {
      return a.kickoff - b.kickoff;
    }

    function renderToday() {
      const selected = document.getElementById("datePicker").value;
      const next = addDays(selected, 1);

      const todays     = matches.filter(m => localDateKey(m.kickoff, currentTz) === selected).sort(sortByKickoff);
      const tomorrows  = matches.filter(m => localDateKey(m.kickoff, currentTz) === next).sort(sortByKickoff);

      document.getElementById("heuteTitle").textContent  = `Heute · ${dateKeyToLabel(selected, currentTz)}`;
      document.getElementById("morgenTitle").textContent = `Morgen · ${dateKeyToLabel(next, currentTz)}`;

      const tList = document.getElementById("todayList");
      const mList = document.getElementById("tomorrowList");
      tList.innerHTML = todays.length    ? todays.map(renderMatch).join("")    : `<div class="placeholder">Keine Spiele.</div>`;
      mList.innerHTML = tomorrows.length ? tomorrows.map(renderMatch).join("") : `<div class="placeholder">Keine Spiele.</div>`;
    }

    function renderMatchList() {
      const gr = document.getElementById("filterGruppe").value;
      const sp = document.getElementById("filterSpieltag").value;
      const filtered = matches
        .filter(m => !gr || m.gruppe === gr)
        .filter(m => !sp || String(m.spieltag) === sp)
        .sort(sortByKickoff);
      document.getElementById("matchCount").textContent = `${filtered.length} von ${matches.length} Spielen`;
      document.getElementById("matchList").innerHTML = filtered.length
        ? filtered.map(renderMatch).join("")
        : `<div class="placeholder">Keine Spiele für diese Auswahl.</div>`;
    }

    // Datums-Picker Min/Max an die gewaehlte Zone anpassen — manche Spaet- bzw.
    // Frueh-Spiele wandern in Vancouver auf einen anderen Kalendertag.
    function updatePickerRange() {
      const keys = matches.map(m => localDateKey(m.kickoff, currentTz));
      const min = keys.reduce((a,b) => a < b ? a : b);
      const max = keys.reduce((a,b) => a > b ? a : b);
      const picker = document.getElementById("datePicker");
      picker.min = min;
      picker.max = max;
      if (picker.value < min) picker.value = min;
      if (picker.value > max) picker.value = max;
    }

    // --- Init ---

    function initFilters() {
      const sel = document.getElementById("filterGruppe");
      GRUPPEN.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = "Gruppe " + g;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", renderMatchList);
      document.getElementById("filterSpieltag").addEventListener("change", renderMatchList);
    }

    function initTzPicker() {
      const sel = document.getElementById("tzPicker");
      TZ_OPTIONS.forEach(o => {
        const opt = document.createElement("option");
        opt.value = o.value;
        opt.textContent = o.label;
        sel.appendChild(opt);
      });
      sel.value = currentTz;
      sel.addEventListener("change", () => {
        currentTz = sel.value;
        localStorage.setItem("tz", currentTz);
        updatePickerRange();
        renderToday();
        renderMatchList();
      });
    }

    // Tab-Umschaltung
    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("datePicker").addEventListener("change", renderToday);

    // Tatsaechliche Hoehen von Header und Tab-Leiste messen, damit die
    // sticky Filter-Leiste sauber darunter andockt (auch bei Resize / Drehung).
    function syncStickyOffsets() {
      const h = document.querySelector("header").offsetHeight;
      const t = document.querySelector("nav.tabs").offsetHeight;
      document.documentElement.style.setProperty("--header-h", h + "px");
      document.documentElement.style.setProperty("--tabs-h", t + "px");
    }
    window.addEventListener("resize", syncStickyOffsets);
    window.addEventListener("orientationchange", syncStickyOffsets);

    initTzPicker();
    initFilters();
    updatePickerRange();
    renderToday();
    renderMatchList();
    syncStickyOffsets();
  </script>
